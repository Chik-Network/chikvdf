name: VDF client matrix

# Called by build-packages.yml twice: once for the optimized packaging matrix
# and once for ASAN/TSAN. This file is only a callee, so it has no concurrency
# group. Policy outputs arrive as inputs with the same names.

on:
  workflow_call:
    inputs:
      configs:
        description: 'JSON array of make configs, such as ["optimized=1"]'
        required: true
        type: string
      is_final:
        description: release-policy output is_final
        required: true
        type: string
      notarize_macos:
        description: release-policy output notarize_macos (accepted for caller
          compatibility; macOS bundles are unsigned, so it has no effect)
        required: true
        type: string

env:
  CHIKVDF_LOG_AVX: "1"

permissions:
  contents: write

jobs:
  build:
    name: CI (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    env:
      # Runtime feature gate read via getenv() in parameters.h.
      # Keep this at job scope so all test/bench steps see it.
      CHIK_ENABLE_AVX512_IFMA: "1"
      # On release workflows, pin embedded CLI version to the tag.
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      INSTALLER_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.1-{0}', github.run_id) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
        config: ${{ fromJSON(inputs.configs) }}
        exclude:
          - os: windows-latest
            config: ASAN=1
          - os: windows-latest
            config: TSAN=1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Python
        uses: Chik-Network/actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Set Env
        uses: Chik-Network/actions/setjobenv@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test macOS bundle packaging scripts
        if: matrix.os == 'ubuntu-latest' && matrix.config == 'optimized=1'
        run: |
          bash tests/test_macos_bundle_dylibs.sh
          bash tests/test_macos_pkg.sh
          bash tests/test_macos_bundle_plan.sh
          bash tests/test_macos_select_signing_identities.sh
          bash tests/test_macos_gmp_build.sh

      # The one gate for the release GMP steps below: the macOS arm64 runner's
      # optimized build, chosen by OS and architecture rather than runner name.
      - name: Select release GMP build (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.config == 'optimized=1'
        run: echo "RELEASE_GMP=1" >> "$GITHUB_ENV"

      # macOS bundles are not signed with a Developer ID and are not notarized.
      # No Apple certificate is imported and no Apple secret is read, so macOS
      # packaging cannot fail on missing credentials. The staged binaries are
      # still re-signed ad-hoc inside scripts/package-macos-bundle.sh, which
      # arm64 requires after install_name_tool rewrites the Mach-O files.
      - name: Install macOS deps (build + runtime)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew ls --versions cmake >/dev/null 2>&1 || brew install cmake
          # Keep gmp installed for CI builds/tests; Homebrew formulas must also
          # declare gmp as a runtime dependency for end-user installs.
          brew ls --versions gmp >/dev/null 2>&1 || brew install gmp
          brew ls --versions boost >/dev/null 2>&1 || brew install boost
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix gmp)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # The arm64 release bundle ships GMP built from source with
      # HGCD2_DIV2_METHOD=1 instead of the Homebrew bottle; see the script.
      # Homebrew GMP stays installed for the other macOS jobs and for CMake.
      - name: Build release GMP (macOS arm64)
        if: env.RELEASE_GMP == '1'
        run: |
          scripts/build-macos-gmp.sh "$RUNNER_TEMP/chikvdf-gmp"
          echo "GMP_PREFIX=$RUNNER_TEMP/chikvdf-gmp" >> "$GITHUB_ENV"

      # Runtime workaround for TSAN-instrumented binaries on Ubuntu runners.
      # Apply before build because make TSAN=1 runs ./compile_asm during build.
      # See: https://github.com/google/sanitizers/issues/1716
      - name: Adjust mmap_rnd_bits before Ubuntu TSAN build/test execution
        if: startsWith(matrix.os, 'ubuntu') && matrix.config == 'TSAN=1'
        run: |
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Build on Ubuntu
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # Keep mmap_rnd_bits workaround step above this build for TSAN=1:
          # make TSAN=1 executes thread-sanitized ./compile_asm during build.
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake libgmp-dev libboost-python-dev libpython3-dev libboost-system-dev
          ./scripts/get-libft4222.sh install
          cd src
          if [ -n "$RELEASE_TAG" ]; then
            make ${{ matrix.config }} CHIKVDF_VERSION="$RELEASE_TAG" -f Makefile.vdf-client vdf_client vdf_bench 1weso_test 2weso_test prover_test hw_proof_wait_test ftdi_identity_test hw_initialization_test emu_hw_test hw_test emu_hw_vdf_client hw_vdf_client
          else
            make ${{ matrix.config }} -f Makefile.vdf-client vdf_client vdf_bench 1weso_test 2weso_test prover_test hw_proof_wait_test ftdi_identity_test hw_initialization_test emu_hw_test hw_test emu_hw_vdf_client hw_vdf_client
          fi

      - name: Build on macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          BOOST_VERSION="$(brew list --versions boost | awk '{print $2}')"
          BOOST_INCLUDE=""
          for cand in \
            "$(brew --prefix boost)/include" \
            "$(brew --prefix)/include" \
            "$(brew --cellar boost)/${BOOST_VERSION}/include"; do
            if [ -f "$cand/boost/asio.hpp" ]; then
              BOOST_INCLUDE="$cand"
              break
            fi
          done
          if [ -z "$BOOST_INCLUDE" ]; then
            echo "Could not locate boost/asio.hpp for brew boost=${BOOST_VERSION}" >&2
            brew --prefix boost || true
            brew --cellar boost || true
            brew info boost || true
            exit 1
          fi
          ./scripts/get-libft4222.sh install
          cd src
          if [ -n "$RELEASE_TAG" ]; then
            make ${{ matrix.config }} CHIKVDF_VERSION="$RELEASE_TAG" GMP_PREFIX="${GMP_PREFIX:-}" CPPFLAGS="-I${BOOST_INCLUDE} ${CPPFLAGS:-}" -f Makefile.vdf-client vdf_client vdf_bench 1weso_test 2weso_test prover_test hw_proof_wait_test ftdi_identity_test hw_initialization_test emu_hw_test hw_test emu_hw_vdf_client hw_vdf_client
          else
            make ${{ matrix.config }} GMP_PREFIX="${GMP_PREFIX:-}" CPPFLAGS="-I${BOOST_INCLUDE} ${CPPFLAGS:-}" -f Makefile.vdf-client vdf_client vdf_bench 1weso_test 2weso_test prover_test hw_proof_wait_test ftdi_identity_test hw_initialization_test emu_hw_test hw_test emu_hw_vdf_client hw_vdf_client
          fi

      - name: Cache Boost on Windows
        if: matrix.os == 'windows-latest'
        id: cache-boost
        uses: actions/cache/restore@v6.1.0
        with:
          path: C:\local\boost_*
          key: windows-boost-msvc-14.3-v1

      - name: Read mpir pin
        if: matrix.os == 'windows-latest'
        id: mpir-pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < scripts/mpir_gc_x64.commit)" >> "$GITHUB_OUTPUT"

      - name: Cache mpir checkout on Windows
        if: matrix.os == 'windows-latest'
        id: cache-mpir
        uses: actions/cache@v6.1.0
        with:
          path: mpir_gc_x64
          key: windows-mpir-gc-x64-${{ steps.mpir-pin.outputs.sha }}

      - name: Checkout mpir for Windows
        if: matrix.os == 'windows-latest' && steps.cache-mpir.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/get-mpir-gc-x64.sh

      - name: Install LLVM, Ninja and Boost on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          BOOST_CACHE_HIT: ${{ steps.cache-boost.outputs.cache-hit }}
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin\clang-cl.exe"
          $ninjaBin = "C:\ProgramData\chocolatey\bin\ninja.exe"
          if (-not (Test-Path $llvmBin) -or -not (Test-Path $ninjaBin)) {
            choco install llvm ninja -y
          }
          $boostDir = Get-ChildItem "C:\local" -Directory -Filter "boost_*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $boostDir) {
            if ("$env:BOOST_CACHE_HIT" -ne "true") {
              Write-Host "Boost cache miss and boost not found, installing boost-msvc-14.3"
              choco install boost-msvc-14.3 -y
            } else {
              Write-Host "Boost cache reported hit but boost directory missing; reinstalling boost-msvc-14.3"
              choco install boost-msvc-14.3 -y
            }
            $boostDir = Get-ChildItem "C:\local" -Directory -Filter "boost_*" -ErrorAction SilentlyContinue | Select-Object -First 1
          } else {
            Write-Host "Boost already present at $($boostDir.FullName), skipping choco install"
          }
          "C:\Program Files\LLVM\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          if (-not $boostDir) {
            throw "Boost install not found under C:\local"
          }
          "BOOST_INCLUDE_DIR=$($boostDir.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Save Boost cache on Windows
        if: matrix.os == 'windows-latest' && steps.cache-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: C:\local\boost_*
          key: ${{ steps.cache-boost.outputs.cache-primary-key }}

      - name: Set up MSVC environment (Windows SDK + CRT libs)
        if: matrix.os == 'windows-latest'
        uses: step-security/msvc-dev-cmd@v1.13.1
        with:
          arch: x64

      - name: Download USB drivers (FT4222H) on Windows
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/get-libft4222.ps1 install

      - name: Build on Windows
        if: matrix.os == 'windows-latest' && matrix.config == 'optimized=1'
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", "src",
            "-B", "build",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TRY_COMPILE_CONFIGURATION=Release",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_ASM_COMPILER=clang-cl",
            "-DBOOST_INCLUDE_DIR=$env:BOOST_INCLUDE_DIR",
            "-DBUILD_PYTHON=OFF",
            "-DBUILD_CHIKVDFC=OFF",
            "-DBUILD_VDF_CLIENT=ON",
            "-DBUILD_VDF_BENCH=ON",
            "-DBUILD_VDF_TESTS=ON",
            "-DBUILD_HW_TOOLS=ON",
            "-DENABLE_GNU_ASM=ON"
          )
          if ($env:RELEASE_TAG) {
            $cmakeArgs += "-DCHIKVDF_VERSION=$env:RELEASE_TAG"
          }
          & cmake @cmakeArgs
          $gnuAsmEnabled = (& cmake -N -L build | Select-String '^ENABLE_GNU_ASM:BOOL=ON$')
          if (-not $gnuAsmEnabled) {
            throw "ENABLE_GNU_ASM is not ON on Windows CI build"
          }
          cmake --build build --target vdf_client vdf_bench 1weso_test 2weso_test prover_test regression_unit_tests regression_io_tests hw_proof_wait_test ftdi_identity_test hw_initialization_test emu_hw_test hw_test emu_hw_vdf_client hw_vdf_client
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed with exit code $LASTEXITCODE"
          }
          $asmFiles = @("asm_compiled.s", "avx2_asm_compiled.s", "avx512_asm_compiled.s")
          foreach ($asmFile in $asmFiles) {
            # Depending on generator/layout, CMAKE_CURRENT_BINARY_DIR for src may resolve
            # to build/ or build/src/. Accept either location to avoid false negatives.
            $candidatePaths = @("build/$asmFile", "build/src/$asmFile")
            $foundPath = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $foundPath) {
              throw "Expected generated asm output not found in build/ or build/src/: $asmFile"
            }
            Write-Host "Verified generated asm output: $foundPath"
          }

      - name: Run HW smoke test (Ubuntu/macOS)
        if: matrix.os != 'windows-latest' && (matrix.config != 'TSAN=1' || startsWith(matrix.os, 'ubuntu'))
        run: |
          cd src
          # CI runners do not have FT4222 hardware attached; only validate binaries exist.
          test -x ./hw_vdf_client
          test -x ./hw_test
          echo "Running hardware-free proof ownership and publication tests"
          ./hw_proof_wait_test
          ./ftdi_identity_test
          ./hw_initialization_test
          echo "Running emu_hw_test"
          ./emu_hw_test 1 2000
          echo "Running emu_hw_vdf_client --list"
          ./emu_hw_vdf_client --list

      - name: Run GoogleTest regressions (Ubuntu/macOS)
        if: matrix.config == 'optimized=1' && matrix.os != 'windows-latest'
        run: |
          cmake -S src -B build-regression -DBUILD_PYTHON=OFF -DBUILD_CHIKVDFC=OFF -DBUILD_VDF_CLIENT=OFF -DBUILD_VDF_BENCH=OFF -DBUILD_VDF_TESTS=ON -DBUILD_HW_TOOLS=OFF -DENABLE_GNU_ASM=ON
          cmake --build build-regression --target regression_unit_tests regression_io_tests
          ctest --test-dir build-regression --output-on-failure -R '^regression\.'

      - name: Run vdf tests (optimized smoke)
        if: matrix.config == 'optimized=1' && matrix.os != 'windows-latest' && !startsWith(matrix.os, 'ubuntu')
        run: |
          cd src
          echo "Running 1weso_test (fast smoke)"
          ./1weso_test 1000
          echo "Running 2weso_test (fast smoke)"
          ./2weso_test 1000

      - name: Run vdf tests (optimized protected threshold path)
        if: matrix.config == 'optimized=1' && startsWith(matrix.os, 'ubuntu')
        run: |
          cd src
          echo "Running 1weso_test (fast smoke)"
          ./1weso_test 1000
          # 100 * 910000 = 91,000,000; this intentionally crosses the 2-weso switch threshold.
          echo "Running 2weso_test (protected threshold path)"
          ./2weso_test 910000

      - name: Run vdf tests (short)
        if: matrix.config != 'optimized=1' && matrix.os != 'windows-latest'
        run: |
          cd src
          echo "Running 1weso_test"
          ./1weso_test 1000
          echo "Running 2weso_test"
          ./2weso_test 1000

      # macos thread sanitizer will give false positives on ./prover_test because
      # it prints to std::cout from multiple threads. Which is allowed by the
      # standard
      - name: Run prover test (Ubuntu/macOS)
        if: matrix.os != 'windows-latest' && (matrix.config != 'TSAN=1' || startsWith(matrix.os, 'ubuntu'))
        run: |
          cd src
          echo "Running prover_test"
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            ./prover_test
          else
            CHIKVDF_PROVER_TEST_FAST=1 ./prover_test
          fi

      - name: Run HW smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd build
          # Keep native stderr as log output; emu binaries log diagnostics there.
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PATH = "$PWD;$PWD\..\src\hw\libft4222;$PWD\..\mpir_gc_x64;$env:PATH"
          # CI runners do not have FT4222 hardware attached; only validate binaries exist.
          if (-not (Test-Path ".\hw_test.exe")) { throw "hw_test.exe is missing" }
          if (-not (Test-Path ".\hw_vdf_client.exe")) { throw "hw_vdf_client.exe is missing" }
          Write-Host "Running hardware-free proof ownership and publication tests"
          .\hw_proof_wait_test.exe
          if ($LASTEXITCODE -ne 0) { throw "hw_proof_wait_test failed with exit code $LASTEXITCODE" }
          .\ftdi_identity_test.exe
          if ($LASTEXITCODE -ne 0) { throw "ftdi_identity_test failed with exit code $LASTEXITCODE" }
          .\hw_initialization_test.exe
          if ($LASTEXITCODE -ne 0) { throw "hw_initialization_test failed with exit code $LASTEXITCODE" }
          Write-Host "Running emu_hw_test"
          .\emu_hw_test.exe 1 2000
          if ($LASTEXITCODE -ne 0) { throw "emu_hw_test failed with exit code $LASTEXITCODE" }
          Write-Host "Running emu_hw_vdf_client --list"
          .\emu_hw_vdf_client.exe --list
          if ($LASTEXITCODE -ne 0) { throw "emu_hw_vdf_client --list failed with exit code $LASTEXITCODE" }

      - name: Run GoogleTest regressions (Windows)
        if: matrix.os == 'windows-latest' && matrix.config == 'optimized=1'
        shell: pwsh
        run: |
          cd build
          $env:PATH = "$PWD;$PWD\..\src\hw\libft4222;$PWD\..\mpir_gc_x64;$env:PATH"
          ctest -C Release --output-on-failure -R '^regression\.'

      - name: Run vdf tests (Windows, optimized smoke)
        if: matrix.os == 'windows-latest' && matrix.config == 'optimized=1'
        shell: pwsh
        run: |
          cd build
          $env:PATH = "$PWD;$PWD\..\src\hw\libft4222;$PWD\..\mpir_gc_x64;$env:PATH"
          Write-Host "Running 1weso_test (fast smoke)"
          .\1weso_test.exe 1000
          if ($LASTEXITCODE -ne 0) { throw "1weso_test failed with exit code $LASTEXITCODE" }
          Write-Host "Running 2weso_test (fast smoke)"
          .\2weso_test.exe 1000
          if ($LASTEXITCODE -ne 0) { throw "2weso_test failed with exit code $LASTEXITCODE" }

      - name: Run prover test (Windows)
        if: matrix.os == 'windows-latest' && matrix.config == 'optimized=1'
        shell: pwsh
        run: |
          cd build
          $env:PATH = "$PWD;$PWD\..\src\hw\libft4222;$PWD\..\mpir_gc_x64;$env:PATH"
          Write-Host "Running prover_test"
          $env:CHIKVDF_PROVER_TEST_FAST = "1"
          .\prover_test.exe
          if ($LASTEXITCODE -ne 0) { throw "prover_test failed with exit code $LASTEXITCODE" }

      - name: Benchmark vdf_bench square (Ubuntu/Mac)
        if: matrix.config == 'optimized=1' && matrix.os != 'windows-latest'
        run: |
          cd src
          echo "Benchmarking vdf_bench with 2,000,000 iterations of square_asm"
          ./vdf_bench square_asm 2000000

      - name: Benchmark vdf_bench square (Windows)
        if: matrix.config == 'optimized=1' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd build
          $env:PATH = "$PWD;$PWD\..\src\hw\libft4222;$PWD\..\mpir_gc_x64;$env:PATH"
          Write-Host "Benchmarking vdf_bench with 2,000,000 iterations of square_asm"
          .\vdf_bench.exe square_asm 2000000
          if ($LASTEXITCODE -ne 0) { throw "vdf_bench failed with exit code $LASTEXITCODE" }

      - name: Package macOS bundle and installer
        if: startsWith(matrix.os, 'macos') && matrix.config == 'optimized=1'
        env:
          MACOS_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'intel' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.1-{0}', github.run_id) }}
          IS_RELEASE: ${{ inputs.is_final }}
        run: scripts/package-macos-bundle.sh

      - name: Verify shipped macOS zip launches without Homebrew
        if: startsWith(matrix.os, 'macos') && matrix.config == 'optimized=1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/macos/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No macOS zip produced to verify" >&2
            exit 1
          fi
          for zip in "${zips[@]}"; do
            scripts/verify-macos-bundle.sh "$zip"
          done

      - name: Verify macOS arm64 zip ships the release GMP
        if: env.RELEASE_GMP == '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/macos/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No macOS zip produced to verify" >&2
            exit 1
          fi
          for zip in "${zips[@]}"; do
            scripts/check-macos-gmp-build.sh "$zip"
          done

      - name: Upload macOS bundle artifact
        if: startsWith(matrix.os, 'macos') && matrix.config == 'optimized=1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.arch == 'ARM64' && 'macos-arm64-bundle' || 'macos-intel-bundle' }}
          path: |
            dist/macos/*.zip
            dist/macos/*.pkg
            dist/macos/*.sha256
            dist/macos/*.signing-status.txt
            dist/macos/*.codesign-summary.txt

      - name: Upload binaries artifact (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.config == 'optimized=1'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.config }}-${{ matrix.os }}
          path: |
            src/vdf_client
            src/vdf_bench
            src/1weso_test
            src/2weso_test
            src/prover_test
            src/emu_hw_test
            src/hw_test
            src/emu_hw_vdf_client
            src/hw_vdf_client
            ${{ matrix.os == 'ubuntu-24.04-arm' && 'src/hw/libft4222/build-arm-v8/libft4222.so' || 'src/hw/libft4222/build-x86_64/libft4222.so' }}

      - name: Upload binaries artifact (macOS)
        if: startsWith(matrix.os, 'macos') && matrix.config == 'optimized=1'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.config }}-${{ matrix.os }}
          path: |
            src/vdf_client
            src/vdf_bench
            src/1weso_test
            src/2weso_test
            src/prover_test
            src/emu_hw_test
            src/hw_test
            src/emu_hw_vdf_client
            src/hw_vdf_client
            src/hw/libft4222/*.dylib

      # package-windows downloads this into the workspace root and expects the
      # build/, src/hw/libft4222/ (including the staged FTDI driver), and
      # mpir_gc_x64/ paths to be preserved.
      - name: Upload binaries artifact (Windows)
        if: matrix.os == 'windows-latest' && matrix.config == 'optimized=1'
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64-binaries
          path: |
            build/vdf_client.exe
            build/vdf_bench.exe
            build/1weso_test.exe
            build/2weso_test.exe
            build/prover_test.exe
            build/emu_hw_test.exe
            build/hw_test.exe
            build/emu_hw_vdf_client.exe
            build/hw_vdf_client.exe
            src/hw/libft4222/*.dll
            src/hw/libft4222/*.lib
            src/hw/libft4222/driver/**
            mpir_gc_x64/*.dll

      - name: Assemble Ubuntu .deb (same runner as build)
        if: startsWith(matrix.os, 'ubuntu') && matrix.config == 'optimized=1'
        env:
          PLATFORM: ${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
          LIBFT4222_DIR: ${{ matrix.os == 'ubuntu-24.04-arm' && 'build-arm-v8' || 'build-x86_64' }}
        run: |
          pip install jinjanator
          CLI_DEB_BASE="chikvdf_$INSTALLER_VERSION-1_$PLATFORM"
          mkdir -p "dist/$CLI_DEB_BASE/usr/bin"
          mkdir -p "dist/$CLI_DEB_BASE/usr/lib"
          mkdir -p "dist/$CLI_DEB_BASE/DEBIAN"
          mkdir -p "dist/$CLI_DEB_BASE/etc/udev/rules.d"
          j2 -o "dist/$CLI_DEB_BASE/DEBIAN/control" assets/deb/control.j2

          cp src/vdf_client dist/$CLI_DEB_BASE/usr/bin/
          cp src/vdf_bench dist/$CLI_DEB_BASE/usr/bin/
          cp src/emu_hw_test dist/$CLI_DEB_BASE/usr/bin/
          cp src/hw_test dist/$CLI_DEB_BASE/usr/bin/
          cp src/hw_vdf_client dist/$CLI_DEB_BASE/usr/bin/
          cp src/emu_hw_vdf_client dist/$CLI_DEB_BASE/usr/bin/
          cp "src/hw/libft4222/$LIBFT4222_DIR/libft4222.so" dist/$CLI_DEB_BASE/usr/lib/
          echo 'SUBSYSTEM=="usb", ATTRS{idVendor}=="0403", ATTRS{idProduct}=="601c", MODE="0666"' > dist/$CLI_DEB_BASE/etc/udev/rules.d/99-chikvdf.rules
          dpkg-deb --build --root-owner-group "dist/$CLI_DEB_BASE"

      - name: Upload Ubuntu installer
        if: startsWith(matrix.os, 'ubuntu') && matrix.config == 'optimized=1'
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: dist/*.deb

  # Windows bundles and installers are assembled here, after the matrix has
  # produced the raw binaries. This job is deliberately unsigned: no signing
  # environment, no OIDC token, no signing credentials, so it runs for pull
  # requests too. Inno Setup omits SignTool/SignedUninstaller because no
  # /DMySignTool is passed, and the installer ships unsigned.
  # REQUIRE_SIGNATURES='false' disables only the Authenticode assertions;
  # Package still enforces the DLL import closure and launches every shipped
  # exe from a clean directory.
  package-windows:
    name: Package Windows bundle
    needs: [build]
    if: contains(inputs.configs, 'optimized=1')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      INSTALLER_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.1-{0}', github.run_id) }}
      IS_RELEASE: ${{ inputs.is_final }}
      REQUIRE_SIGNATURES: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-amd64-binaries
          path: .

      - name: Verify downloaded Windows build inputs
        shell: pwsh
        run: |
          $required = @(
            'build/vdf_client.exe',
            'build/vdf_bench.exe',
            'build/emu_hw_test.exe',
            'build/hw_test.exe',
            'build/emu_hw_vdf_client.exe',
            'build/hw_vdf_client.exe',
            'mpir_gc_x64/mpir.dll',
            'src/hw/libft4222',
            'src/hw/libft4222/driver/ftdibus.inf',
            'src/hw/libft4222/driver/ftdibus.cat',
            'src/hw/libft4222/driver/ftdiport.inf',
            'src/hw/libft4222/driver/ftdiport.cat',
            'src/hw/libft4222/driver/amd64/ftdibus.sys',
            'src/hw/libft4222/driver/amd64/ftd2xx64.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing Windows build input: $path"
            }
          }

      - name: Set up MSVC environment (Windows SDK + CRT libs)
        uses: step-security/msvc-dev-cmd@v1.13.1
        with:
          arch: x64

      - name: Assemble Windows zip bundle
        shell: pwsh
        run: ./scripts/package-windows-bundle.ps1 -Action Assemble

      - name: Test installer version parser
        shell: pwsh
        run: ./tests/test_windows_installer_version.ps1

      - name: Install Inno Setup
        uses: ./.github/actions/install-inno-setup

      - name: Package and verify Windows zip bundle
        shell: pwsh
        run: ./scripts/package-windows-bundle.ps1 -Action Package

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/package-windows-bundle.ps1 -Action BuildInstaller

      - name: Finalize Windows installer
        shell: pwsh
        run: ./scripts/package-windows-bundle.ps1 -Action FinalizeInstaller

      - name: Verify Windows installer
        shell: pwsh
        run: ./scripts/package-windows-bundle.ps1 -Action VerifyInstaller

      - name: Smoke-test Windows installer
        shell: pwsh
        run: ./scripts/package-windows-bundle.ps1 -Action TestInstaller

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64-bundle
          if-no-files-found: error
          path: |
            dist/windows/*.zip
            dist/windows/*setup.exe
            dist/windows/*.sha256
